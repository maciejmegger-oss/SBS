<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
body{margin:0;background:transparent;display:flex;flex-direction:column;gap:40px;align-items:flex-start;padding:40px}
.l{display:inline-flex;align-items:center;gap:34px;padding:40px 56px}
.mark{width:150px;height:150px;border-radius:40px;display:grid;place-items:center;background:linear-gradient(135deg,#ff3d7f,#ff8a5b);color:#fff;font-size:84px;transform:rotate(-8deg);box-shadow:0 20px 36px -16px rgba(255,61,127,.8);font-family:"Plus Jakarta Sans",sans-serif;line-height:1}
.mark svg{width:58%;height:58%;transform:translateY(3%)}
.t{display:flex;flex-direction:column;line-height:1.05}
.t small{font:700 34px "Plus Jakarta Sans",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#6c6380}
.t b{font:800 84px "Bricolage Grotesque",sans-serif;letter-spacing:-.025em;color:#1d1030}
.dark .t small{color:#cfc2e6}.dark .t b{color:#fff}
.dark-bg{background:#1d1030;border-radius:0}
.v{flex-direction:column;gap:30px;text-align:center}.v .t{align-items:center}
.icon{padding:40px}
.icon .mark{width:400px;height:400px;border-radius:110px;font-size:230px;box-shadow:0 40px 60px -30px rgba(255,61,127,.8)}
</style></head><body>
